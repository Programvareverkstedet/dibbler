[general]
quit_allowed = true
stop_allowed = false
show_tracebacks = true
input_encoding = 'utf8'

# NOTE: please make sure that the pager cannot execute arbitrary commands
#       when running in kiosk mode. `less` is safe because we internally set
#       `LESSECURE=1`, but other pagers may be unsafe.
pager = 'less'

[database]
type = 'sqlite'

[database.sqlite]
path = 'test.db'

[database.postgresql]
host = 'localhost'
# host = '/run/postgresql'
port = 5432

username = 'dibbler'
dbname = 'dibbler'

# You can either specify a path to a file containing the password,
# or just specify the password directly
# password = 'superhemlig'
# password_file = '/var/lib/dibbler/db-password'


# See https://pypi.org/project/brother_ql/ for label types
# Set rotate to False for endless labels
[printer]
label_type = '62'
label_rotate = false
